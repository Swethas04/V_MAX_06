version: '3.9'

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: samadhan_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-samadhan}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-samadhan_secret}
      POSTGRES_DB: ${DB_NAME:-samadhan_setu}
    ports:
      - '5434:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init-extensions.sql:/docker-entrypoint-initdb.d/init.sql

  redis:
    image: redis:7-alpine
    container_name: samadhan_redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata:
