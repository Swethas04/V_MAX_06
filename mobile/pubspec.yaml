name: samadhan_setu
description: SANKALP — Societal Innovation Collaboration Portal (SIH PS 26043)
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Navigation
  go_router: ^14.0.0

  # Network
  dio: ^5.4.0
  connectivity_plus: ^6.0.0

  # Local storage / offline queue
  hive_flutter: ^1.1.0
  hive: ^2.2.3

  # State management
  flutter_riverpod: ^2.5.0

  # UI / Design
  google_fonts: ^6.2.0
  flutter_svg: ^2.0.10
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  lottie: ^3.1.0
  fl_chart: ^0.68.0

  # Location
  geolocator: ^11.0.0
  geocoding: ^3.0.0

  # Media
  image_picker: ^1.1.0
  permission_handler: ^11.3.0

  # Internationalization
  intl: ^0.20.2

  # Notifications
  firebase_core: ^3.0.0
  firebase_messaging: ^15.0.0
  flutter_local_notifications: ^17.0.0

  # Utilities
  uuid: ^4.4.0
  timeago: ^3.6.0
  url_launcher: ^6.3.0
  share_plus: ^10.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.9
  hive_generator: ^2.0.1
  json_annotation: ^4.9.0
  json_serializable: ^6.8.0
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  generate: true  # Enables l10n generation

  assets:
    - assets/images/
    - assets/animations/
    - assets/translations/
